      - dencad/modeling/windowing.py
      - dencad/modeling/evaluate.py
      - dencad/utils.py
      - data/raw/categorical_columns.yaml
      - data/processed/swat/swat_train.parquet
      - data/processed/swat/swat_validation.parquet
    params:
      - data
      - dencad
    outs:
      - reports/search_dencad_swat.json:
          cache: false

