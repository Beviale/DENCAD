data:
  window_steps:                     
    swat: 60                         # 1 s per reading
    hai: 30                          # 1 s per reading
    esa: 132                         # 60 s per reading, so about 2 hours
  eps: &eps
    swat: [1.05, 1.20]
    hai: [5.80, 6.10]
    esa_rare_anomalies: [6.28, 6.53]
    esa_anomalies: [5.11, 5.37]
    esa_rare_anomalies_contaminated: [3.10, 3.26]
    esa_anomalies_contaminated: [3.10, 3.26]
  scale_windows: true
  seed: 42
  workers: 4

# Threshold of the sigma rule, in deviations.
k_sigma: [0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0]

# K-Means on the windows
kmeans:
  contaminated_refit: false
  min_coverage: 0.5
  max_iter: 50
  grid:
    k: [2, 4, 8, 16, 32, 64]         # number of clusters

# DENCAST's graph.
sigma:
  contaminated_refit: false
  min_coverage: 0.5
  attach_to: clustered             
  grid:
    bits: [16, 24]
    permutations: [10, 20]
    band: [20, 50]
    eps: *eps
    width_factor: [1.0, 2.0]         # bucket width of the p-stable hash, in units of eps
    min_pts: [10, 5]                
    label_change_rate: [0.05]       

# Autoencoder on one window at a time. No graph: the control for DENCAD.
plain:
  contaminated_refit: false
  min_coverage: 0.5
  max_epochs: 200
  grid:
    hidden: [64, 128]
    latent: [16, 32]
    layers: [2, 3]
    learning_rate: [0.001, 0.003]
    batch_size: [128]
    patience: [20]

# DENCAD.
dencad:
  contaminated_refit: false
  min_coverage: 0.5
  max_epochs: 200
  attach_to: clustered
  mask_centre: false                 # hide the centre's own attributes, or keep them
  replicas: 4
  scale_learning_rate: true
  grid:
    bits: [16, 24]
    permutations: [10, 20]
    band: [20, 50]
    eps: *eps
    width_factor: [1.0, 2.0]         # bucket width of the p-stable hash, in units of eps
    min_pts: [10, 5]
    label_change_rate: [0.05]
    max_members:                     # members per example
      swat: [500]
      hai: [500]
      esa: [150]
    hidden: [64, 128]
    latent: [16, 32]
    layers: [2, 3]
    learning_rate: [0.001, 0.003]
    batch_size: [128]
    patience: [20]

# The same autoencoder on the hop ball of the nearest object, without the clustering.
ego:
  contaminated_refit: false
  min_coverage: 0.5
  max_epochs: 200
  mask_centre: false
  grid:
    bits: [16, 24]
    permutations: [10, 20]
    band: [20, 50]
    eps: *eps
    width_factor: [1.0, 2.0]
    hidden: [64, 128]
    latent: [16, 32]
    layers: [2, 3]
    learning_rate: [0.001, 0.003]
    batch_size: [128]
    patience: [20]
