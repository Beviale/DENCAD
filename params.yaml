data:
  window_steps:                     
    swat: 60                         # 1 s per reading
    hai: 30                          # 1 s per reading
    esa: 132                         # 18 s per reading, so about 40 minutes
  eps: &eps
    swat: [1.05, 1.20]
    hai: [5.80, 6.10]
    esa: [5.20, 5.40]
  scale_windows: true
  seed: 42
  workers: 4

# Threshold of the sigma rule, in deviations.
k_sigma: [2.0, 2.5, 3.0, 3.5]

# K-Means on the windows
kmeans:
  contaminated_refit: false
  min_coverage: 0.5
  max_iter: 50
  grid:
    k: [2, 4, 8, 16, 32, 64]         # number of clusters

# DENCAST's graph.
sigma:
  contaminated_refit: false
  min_coverage: 0.5
  attach_to: clustered             
  grid:
    bits: [16, 24]
    permutations: [10, 20]
    band: [20, 50]
    eps: *eps
    width_factor: [1.0, 2.0]         # bucket width of the p-stable hash, in units of eps
    min_pts: [10, 5]                
    label_change_rate: [0.05]       

# Autoencoder on one window at a time. No graph: the control for DENCAD.
plain:
  contaminated_refit: false
  min_coverage: 0.5
  max_epochs: 200
  grid:
    hidden: [64, 128]
    latent: [16, 32]
    layers: [2, 3]
    learning_rate: [0.001, 0.003]
    batch_size: [128]
    patience: [20]

# DENCAD.
dencad:
  contaminated_refit: false
  min_coverage: 0.5
  max_epochs: 200
  attach_to: clustered
  max_members: 500                   # cap on the cluster members per example
  mask_centre: false                 # hide the centre's own attributes, or keep them
  replicas: 4
  scale_learning_rate: true
  grid:
    bits: [16, 24]
    permutations: [10, 20]
    band: [20, 50]
    eps: *eps
    width_factor: [1.0, 2.0]         # bucket width of the p-stable hash, in units of eps
    min_pts: [10, 5]
    label_change_rate: [0.05]
    hidden: [64, 128]
    latent: [16, 32]
    layers: [2, 3]
    learning_rate: [0.001, 0.003]
    batch_size: [128]
    patience: [20]
