kmeans:
  k_values: [2, 4, 8, 16, 32, 64]
  window_steps:
    swat: 60     
    hai: 30       
    esa: 33       
  min_coverage: 0.5
  seed: 42
  max_iter: 50
  contaminated_refit: false
  scale_windows: true
  workers: 4

# DENCAD: the anomaly detector built on DENCAST's clusters.
dencad:
  # --- neighbourhood graph (LSH) ---
  bits: 16
  permutations: 10
  band: 20
  min_similarity:
    swat: 0.9858
    hai: 0.7367
    esa: 0.95    

  # --- density and clustering ---
  min_pts: 10                 # degree for a core object, DBSCAN's minPts
  label_change_rate: 0.05     # stop below this share of |E| propagations
  attach_to: clustered        # core | clustered | any: what a new object may attach to

  # --- contextual subgraphs ---
  max_members: null  # null is the whole cluster
  max_hops: 2  
  mask_centre: false # hide the centre's own attributes, or keep them

  # --- autoencoder ---
  hidden: 64
  latent: 16
  layers: 2                  
  learning_rate: 0.001
  batch_size: 128
  max_epochs: 150
  patience: 20
  early_stopping: validation_ap
  holdout: 0.1                # slice of train for early stopping
  train_examples: null        # null uses every training window
  scale_windows: true    
  replicas: 4
  scale_learning_rate: true
  seed: 42
  workers: 4

  # ------------------------------------------------------------------ grid search
  grid:
    bits: [16, 24]
    permutations: [10, 20]
    band: [20, 50]
    
    min_similarity:
      hai: [0.7367, 0.8741]
      swat: [0.9858, 0.9910]
      esa: [0.95, 0.90]   

    # --- density and clustering
    min_pts: [10, 5]                  
    label_change_rate: [0.05] 

    # --- contextual subgraphs. 
    max_members: [null]          # null is the whole cluster
    mask_centre: [false]        # hide the centre's own attributes, or keep them

    # --- autoencoder
    hidden: [64, 128]  
    latent: [16, 32]                                      
    layers:  [2, 3]                                            
    learning_rate: [0.001, 0.003]
    batch_size: 128
    max_epochs: 200
    patience: [20]
